name: Release

on:
  push:
    branches:
      - main

# Serialize release runs so two pushes to main can't race the
# "Version Packages" PR or the publish step.
concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # Hard gate: same checks as PR CI. If anything fails the `release`
  # job below is skipped, so nothing can be published on a red main.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the "Version Packages" branch + create GitHub releases
      pull-requests: write # open/update the "Version Packages" PR
      id-token: write # npm provenance attestations
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Changesets needs full git history to compute changelogs.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Trusted publishing requires Node ≥22.14.0 and npm ≥11.5.1
          # (https://docs.npmjs.com/trusted-publishers).
          node-version: "22.14"
          registry-url: "https://registry.npmjs.org"
          # Avoid dependency cache on publish jobs (npm + setup-node guidance).
          package-manager-cache: false

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      # Build before invoking changesets so `dist/cli.js` (referenced by
      # the `bin` field in package.json) exists when npm reads the
      # manifest. Without this, npm emits "No bin file found at
      # dist/cli.js" during publish, which `@changesets/cli` surfaces as
      # an error. `prepublishOnly` is kept as a safety net but isn't
      # sufficient on its own because the warning fires during the
      # metadata read that happens before publish lifecycle scripts.
      - name: Build
        run: npm run build

      # When there are unconsumed changesets in `.changeset/`, this
      # opens or updates a "Version Packages" PR.
      # When there are none (because that PR was just merged), it runs
      # `npm run release` which publishes the new version to npm.
      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Publishing uses OIDC (trusted publisher). Do not set
          # NODE_AUTH_TOKEN here — a classic/automation token overrides OIDC
          # and breaks trusted publishing.
