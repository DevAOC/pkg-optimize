name: Feature request
description: Suggest an improvement, a new capability, or a new built-in preset.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature. Before submitting:
        - Search [existing issues](https://github.com/DevAOC/pkg-optimize/issues?q=is%3Aissue) — even closed ones.
        - **Requesting a built-in preset?** Use this template and prefix the title with `Preset request:`. The preset contribution path is documented in [`CONTRIBUTING.md`](https://github.com/DevAOC/pkg-optimize/blob/main/CONTRIBUTING.md#adding-or-modifying-a-preset).

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do that pkg-optimize doesn't currently support? Concrete real-world examples are much more useful than abstract requests.
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed solution
      description: If you have a specific design in mind, describe it. If not, leave this blank — describing the problem clearly is more important than proposing a solution.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about, and why they don't fit. Include any workarounds you're using today.

  - type: input
    id: packages
    attributes:
      label: Packages this would help with
      description: If specific npm packages motivated the request, list them here.
      placeholder: "@some/package, another-package"

  - type: dropdown
    id: contribute
    attributes:
      label: Are you willing to contribute this?
      description: This doesn't block the request — it just helps with prioritization.
      options:
        - "Yes, I can open a PR"
        - "Maybe, with guidance from a maintainer"
        - "No, I just need it"
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: I agree to follow this project's [Code of Conduct](https://github.com/DevAOC/pkg-optimize/blob/main/CODE_OF_CONDUCT.md).
          required: true
